
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NexusHub - Events</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee+Outline&display=swap"
        rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet">

  <!-- Custom Styling -->
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }

    .event-heading {
      color: #56996d;
      font-family: 'Space Grotesk', sans-serif;
    }

    .event-card {
      transition: transform 0.2s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
    }
  </style>

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarTogglerDemo01"
              aria-controls="navbarTogglerDemo01"
              aria-expanded="false"
              aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo01">

        <!-- Logo -->
        <a class="navbar-brand fs-1"
           style="font-family: 'Audiowide';"
           href="index.html">
          NexusHub
        </a>

        <!-- Navigation -->
        <ul class="nav nav-pills">

          <li class="nav-item">
            <a class="nav-link"
               style="font-family: 'Space Grotesk';"
               href="index.html">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-family: 'Space Grotesk';"
               href="Updates.html">
              Updates
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-family: 'Space Grotesk';"
               href="Resources.html">
              Resources
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active"
               aria-current="page"
               href="Events.html"
               style="background-color: #56996d; font-family: 'Space Grotesk';">
              Events
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-family: 'Space Grotesk';"
               href="Login.html">
              Login/Sign Up
            </a>
          </li>

        </ul>

        <!-- Search -->
        <form class="d-flex ms-auto" role="search">

          <input class="form-control me-2"
                 type="search"
                 placeholder="Search"
                 aria-label="Search">

          <button class="btn btn-outline-success" type="submit">
            Search
          </button>

        </form>

      </div>

    </div>

  </nav>


  <!-- Events Section -->
  <div class="container mt-5">

    <!-- Page Introduction -->
    <div class="text-center">

      <h1 style="font-family: 'Space Grotesk';">
        Events
      </h1>

      <p class="lead" style="font-family: 'Space Grotesk';">
        Discover workshops, hackathons, meetups, and other opportunities
        to learn, connect, and grow.
      </p>

    </div>


    <!-- Upcoming Events -->
    <h2 class="mt-5 mb-4 event-heading">
      Upcoming Events
    </h2>

    <!-- JavaScript will generate upcoming event cards here -->
    <div class="row g-4" id="upcoming-events-container">

    </div>


    <!-- Past Events -->
    <div class="bg-light rounded-4 p-4 mt-5">

      <h2 class="mb-4 text-secondary">
        Past Events
      </h2>

      <!-- JavaScript will generate past event cards here -->
      <div class="row g-4" id="past-events-container">

      </div>

    </div>

  </div>


  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous">
  </script>

  <!-- Central Website Data -->
  <script src="data.js"></script>

  <!-- Dynamic Page Rendering -->
  <script src="main.js"></script>

</body>

</html>
