
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NexusHub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body, button, input, textarea, select {
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      color: #212529;
      background: #fff;
    }

    .brand {
      font-family: 'Audiowide', Arial, Helvetica, sans-serif !important;
      font-size: 37px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -2.2px;
      color: #050505;
      white-space: nowrap;
    }

    .search-input {
      width: 206px;
    }

    .login-card {
      max-width: 760px;
    }

    @media (max-width: 900px) {
      .search-area {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

      <a class="navbar-brand fs-1"
         style="font-family: 'Audiowide';"
         href="index.html">
        NexusHub
      </a>

      <div class="navbar-collapse">

        <ul class="nav nav-pills">

          <li class="nav-item">
            <a class="nav-link"
               href="index.html"
               style="font-family: 'Space Grotesk';">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               href="Updates.html"
               style="font-family: 'Space Grotesk';">
              Updates
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               href="Resources.html"
               style="font-family: 'Space Grotesk';">
              Resources
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-family: 'Space Grotesk';"
               href="Events.html">
              Events
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active"
               href="Login.html"
               style="background-color: #56996d; font-family: 'Space Grotesk';">
              Login / Sign Up
            </a>
          </li>

        </ul>

        <!-- SEARCH -->
        <form class="d-flex ms-auto" role="search">

          <input class="form-control me-2"
                 type="search"
                 placeholder="Search"
                 aria-label="Search">

          <button class="btn btn-outline-success"
                  type="submit">
            Search
          </button>

        </form>

      </div>

    </div>

  </nav>


  <!-- Admin Login -->
  <main class="container py-4">

    <h1 class="fs-2 fw-normal my-4">Admin Login</h1>

    <div class="card shadow-sm p-4 login-card">

      <!-- Email -->
      <div class="row g-3 align-items-center">

        <label class="col-md-3 col-form-label" for="email">
          Email Address
        </label>

        <div class="col-md-6">

          <input
            id="email"
            class="form-control"
            type="email"
            placeholder="Enter your email address"
            autocomplete="username"
            required
          >

        </div>

      </div>


      <!-- Password -->
      <div class="row g-3 align-items-center mt-1">

        <label class="col-md-3 col-form-label" for="password">
          Password
        </label>

        <div class="col-md-6">

          <input
            id="password"
            class="form-control"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

      </div>


      <!-- Login Button -->
      <div class="row g-3 mt-3">

        <div class="col-md-3"></div>

        <div class="col-md-6">

          <button
            id="loginBtn"
            class="btn btn-success"
            type="button"
          >
            Login
          </button>

        </div>

      </div>


      <!-- Status Message -->
      <p
        id="statusMessage"
        class="mt-3 mb-0"
        role="status"
        aria-live="polite"
      ></p>


      <!-- Success Message -->
      <div
        id="successMessage"
        class="alert alert-success mt-3 d-none"
        role="alert"
      >
        Welcome to NexusHub Admin Panel! Login successful.
      </div>

      <a href="Login.html" class="d-inline-block mt-3 text-decoration-none">
        ← Back
      </a>

    </div>

  </main>


  <!-- Firebase Authentication -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDom4NZglA9ZWwLk1OJPNXWEZ2ccV8jByU",
      authDomain: "nexushub-ed657.firebaseapp.com",
      projectId: "nexushub-ed657",
      storageBucket: "nexushub-ed657.firebasestorage.app",
      messagingSenderId: "643206928035",
      appId: "1:643206928035:web:d5d8ac522f7181a57c5116",
      measurementId: "G-49KR06C5NP"
    };


    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // Authorized Admin Email Array
    // Replace these examples with your four actual admin emails.

    const adminEmails = [
      "teamnexushub@gmail.com",
    ].map(email => email.toLowerCase());


    // HTML Elements
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    const statusMessage =
      document.getElementById("statusMessage");

    const successMessage =
      document.getElementById("successMessage");


    // Display Status Messages
    function showStatus(message, isError = false) {

      statusMessage.textContent = message;

      statusMessage.className = isError
        ? "mt-3 mb-0 text-danger"
        : "mt-3 mb-0 text-success";

    }


    // Admin Login
    async function adminLogin() {

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;


      // Validate inputs
      if (!email || !password) {

        showStatus(
          "Please enter your email address and password.",
          true
        );

        return;

      }


      if (!emailInput.checkValidity()) {

        showStatus(
          "Please enter a valid email address.",
          true
        );

        return;

      }


      loginBtn.disabled = true;

      showStatus("Verifying login details...");


      try {

        // Step 1: Verify credentials with Firebase
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        // Step 2: Check whether the email belongs to an admin
        const loggedInEmail =
          userCredential.user.email?.toLowerCase();


        if (!loggedInEmail || !adminEmails.includes(loggedInEmail)) {

          // Sign out unauthorized users
          await signOut(auth);

          showStatus(
            "Access denied. You are not an authorized admin.",
            true
          );

          loginBtn.disabled = false;

          return;

        }


        // Step 3: Successful admin login
        successMessage.classList.remove("d-none");

        showStatus(
          "Admin login successful! Redirecting..."
        );


        // Step 4: Redirect to existing homepage
        setTimeout(() => {

          window.location.href = "index_.html";

        }, 1000);


      } catch (error) {

        console.error("Firebase login error:", error);

        let message = "Login failed. Please try again.";

        if (
          error.code === "auth/invalid-credential" ||
          error.code === "auth/wrong-password" ||
          error.code === "auth/user-not-found"
        ) {

          message = "Incorrect email address or password.";

        } else if (error.code === "auth/invalid-email") {

          message = "Please enter a valid email address.";

        } else if (error.code === "auth/too-many-requests") {

          message = "Too many attempts. Please try again later.";

        } else if (error.code === "auth/operation-not-allowed") {

          message = "Email/Password sign-in is not enabled in Firebase.";

        }

        showStatus(message, true);

        loginBtn.disabled = false;

      }

    }


    // Login Button Click
    loginBtn.addEventListener("click", adminLogin);


    // Login Using Enter Key
    passwordInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        adminLogin();
      }

    });

    emailInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {
        adminLogin();
      }

    });

  </script>

</body>
</html>
