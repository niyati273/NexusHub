
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NexusHub</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  
<style>
  body, button, input, textarea, select {
    font-family: 'Space Grotesk', sans-serif;
  }

  body {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.5;
    color: #212529;
    background: #f7f9f7;
  }

  .brand {
    font-family: 'Audiowide', Arial, Helvetica, sans-serif !important;
    font-size: 37px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -2.2px;
    color: #050505;
    white-space: nowrap;
  }

  .search-input {
    width: 206px;
  }

  /* Signup section */
  .signup-section {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px 15px;
  }

  .signup-card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    padding: 38px;
    border-radius: 16px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.07);
  }

  .signup-heading {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
  }

  .signup-subheading {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .form-label {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 7px;
  }

  .form-control,
  .form-select {
    padding: 11px 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #56996d;
    box-shadow: 0 0 0 3px rgba(86,153,109,0.12);
  }

  .signup-btn {
    width: 100%;
    background: #56996d;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 16px;
    margin-top: 12px;
  }

  .signup-btn:hover {
    background: #438357;
    color: white;
  }

  .signup-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .login-text {
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
  }

  .login-text a {
    color: #56996d;
    font-weight: 600;
    text-decoration: none;
  }

  .login-text a:hover {
    text-decoration: underline;
  }

  .status-message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-top: 15px;
  }

  @media (max-width: 900px) {
    .search-area {
      width: 100%;
    }
  }

  @media (max-width: 576px) {
    .signup-card {
      padding: 25px 20px;
    }

    .signup-heading {
      font-size: 24px;
    }
  }
</style>

</head>

<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="container-fluid">

      <a class="navbar-brand fs-1"
         style="font-family: 'Audiowide';"
         href="index.html">
        NexusHub
      </a>

      <div class="navbar-collapse">

        <ul class="nav nav-pills">

          <li class="nav-item">
            <a class="nav-link"
               href="index.html"
               style="font-family: 'Space Grotesk';">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               href="Updates.html"
               style="font-family: 'Space Grotesk';">
              Updates
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               href="Resources.html"
               style="font-family: 'Space Grotesk';">
              Resources
            </a>
          </li>

          <!-- EVENTS -->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="Events.html"
                           style="font-family: 'Space Grotesk';">

                            Events

                        </a>

                    </li>


          <li class="nav-item">
            <a class="nav-link active"
               href="Login.html"
               style="background-color: #56996d; font-family: 'Space Grotesk';">
              Login / Sign Up
            </a>
          </li>

        </ul>

        <!-- SEARCH -->
        <form class="d-flex ms-auto" role="search">

          <input class="form-control me-2"
                 type="search"
                 placeholder="Search"
                 aria-label="Search">

          <button class="btn btn-outline-success"
                  type="submit">
            Search
          </button>

        </form>

      </div>

    </div>

  </nav>

  <!-- Signup Form -->
  <section class="signup-section">

    <div class="signup-card">

      <h2 class="signup-heading">Join NexusHub</h2>

      <p class="signup-subheading">
        Create your account and become part of our community.
      </p>

      <form id="signupForm">

        <!-- Full Name -->
        <div class="mb-3">
          <label class="form-label" for="fullName">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <!-- Branch -->
        <div class="mb-3">
          <label class="form-label" for="branch">Branch</label>

          <select class="form-select" id="branch" required>
            <option value="" selected disabled>Select your branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="IT">IT</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Year -->
        <div class="mb-3">
          <label class="form-label" for="year">Year of Study</label>

          <select class="form-select" id="year" required>
            <option value="" selected disabled>Select your year</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </select>
        </div>

        <!-- Phone Number -->
        <div class="mb-3">
          <label class="form-label" for="phone">
            Phone Number <span class="text-muted">(Optional)</span>
          </label>

          <input
            type="tel"
            class="form-control"
            id="phone"
            placeholder="Enter your phone number"
            pattern="[0-9]{10}"
            title="Enter a 10-digit phone number"
          >
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label" for="email">Email Address</label>

          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="Enter your email address"
            required
          >
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>

          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            placeholder="Re-enter your password"
            minlength="6"
            required
          >
        </div>

        <!-- Submit -->
        <button type="submit" class="signup-btn" id="signupButton">
          Create Account
        </button>

      </form>

      <!-- Status -->
      <div id="statusMessage" class="status-message"></div>

      <!-- Verification check -->
      <button
        type="button"
        class="signup-btn"
        id="verifyButton"
        style="display:none;"
      >
        I've Verified My Email
      </button>

      <p class="login-text">
        Already have an account?
        <a href="Login.html">Login</a>
      </p>

    </div>

  </section>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


  <!-- Firebase -->
  
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    sendEmailVerification,
    updateProfile,
    reload
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDom4NZglA9ZWwLk1OJPNXWEZ2ccV8jByU",
    authDomain: "nexushub-ed657.firebaseapp.com",
    projectId: "nexushub-ed657",
    storageBucket: "nexushub-ed657.firebasestorage.app",
    messagingSenderId: "643206928035",
    appId: "1:643206928035:web:d5d8ac522f7181a57c5116",
    measurementId: "G-49KR06C5NP"
  };


  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  const signupForm = document.getElementById("signupForm");
  const signupButton = document.getElementById("signupButton");
  const statusMessage = document.getElementById("statusMessage");
  const verifyButton = document.getElementById("verifyButton");


  // Display messages
  function showMessage(message, type) {

    statusMessage.style.display = "block";
    statusMessage.className = "status-message alert alert-" + type;
    statusMessage.textContent = message;

  }


  // Firebase error messages
  function getErrorMessage(errorCode) {

    switch (errorCode) {

      case "auth/email-already-in-use":
        return "This email address is already registered.";

      case "auth/invalid-email":
        return "Please enter a valid email address.";

      case "auth/weak-password":
        return "Your password must contain at least 6 characters.";

      case "auth/operation-not-allowed":
        return "Email/Password sign-in is not enabled in Firebase.";

      case "auth/network-request-failed":
        return "Network error. Please check your internet connection.";

      case "auth/too-many-requests":
        return "Too many attempts. Please try again later.";

      default:
        return "Something went wrong. Please try again.";
    }

  }


  // Student Signup
  signupForm.addEventListener("submit", (event) => {

    event.preventDefault();

    const fullName =
      document.getElementById("fullName").value.trim();

    const branch =
      document.getElementById("branch").value;

    const year =
      document.getElementById("year").value;

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    // Password validation
    if (password !== confirmPassword) {

      showMessage("Passwords do not match.", "danger");
      return;

    }


    signupButton.disabled = true;
    signupButton.textContent = "Creating Account...";


    // Create Firebase account
    createUserWithEmailAndPassword(auth, email, password)

      .then((userCredential) => {

        // Signed up
        const user = userCredential.user;

        // Save student's name in Firebase profile
        return updateProfile(user, {
          displayName: fullName
        }).then(() => {

          // Send verification email
          return sendEmailVerification(user, {
            url: window.location.origin + "/signup.html"
          });

        });

      })

      .then(() => {

        // Verification email sent
        signupForm.style.display = "none";
        verifyButton.style.display = "block";

        showMessage(
          "Your account has been created! We have sent a verification email to " +
          email +
          ". Please verify your email and then click the button below.",
          "success"
        );

      })

      .catch((error) => {

        const errorCode = error.code;
        const errorMessage = error.message;

        console.error(errorCode, errorMessage);

        showMessage(
          getErrorMessage(errorCode),
          "danger"
        );

        signupButton.disabled = false;
        signupButton.textContent = "Create Account";

      });

  });


  // Check Email Verification
  verifyButton.addEventListener("click", () => {

    const user = auth.currentUser;

    if (!user) {

      showMessage(
        "Please sign in again to check your verification status.",
        "warning"
      );

      return;

    }


    // Reload user information
    reload(user)

      .then(() => {

        if (auth.currentUser.emailVerified) {

          showMessage(
            "Email verified successfully! Your registration can now proceed for admin review.",
            "success"
          );

          verifyButton.style.display = "none";

        }

        else {

          showMessage(
            "Your email is not verified yet. Please check your inbox and spam folder.",
            "warning"
          );

        }

      })

      .catch((error) => {

        console.error(error);

        showMessage(
          "Unable to check verification status. Please try again.",
          "danger"
        );

      });

  });

</script>


</body>
</html>
